[package]
name = "stelnettts-sys"
version = "0.8.29"
edition = "2021"
description = "Raw FFI bindings to StelnetTTS — auto-builds libstelnettts from source via cmake, or links a pre-installed copy if STELNETTTS_LIB_DIR is set."
license = "MIT"
repository = "https://github.com/Cyna/StelnetTTS"
homepage = "https://github.com/Cyna/StelnetTTS"
documentation = "https://docs.rs/stelnettts-sys"
readme = "README.md"
keywords = ["asr", "speech-recognition", "whisper", "ggml", "ffi"]
categories = ["external-ffi-bindings", "multimedia::audio"]
links = "stelnettts"

# The crate is a pure FFI shim — only the .rs sources, build.rs, README,
# LICENSE, and Cargo.toml ship to crates.io. The native library is not
# vendored; build.rs locates an existing build, runs cmake on the parent
# repo, or (legacy) links a system-installed `libstelnettts.{so,dylib,dll}`
# when `STELNETTTS_LIB_DIR` is set. The crates.io publish is a no-op for
# the cmake path: it requires the parent StelnetTTS sources, which only
# exist in a git checkout — that's the same trade-off StelnetEmbed makes.
include = ["src/**/*.rs", "build.rs", "Cargo.toml", "README.md", "LICENSE"]

[features]
default = []
# When build.rs runs cmake itself (decision tree in build.rs), these
# features map to `-DGGML_{CUDA,METAL,VULKAN}=ON`. For the legacy
# STELNETTTS_LIB_DIR path they're inert — the system-installed
# `libstelnettts` already encodes whichever backends it was built with.
cuda = []
metal = []
vulkan = []
