name: Bindings Tests (Dart)
# The Flutter/Dart binding had no PR-time job. flutter/stelnettts/test/chat_test.dart
# is 600+ lines and its first layer — the symbol-resolution test — is exactly the
# check that catches an ABI entry point disappearing from libstelnettts, which is
# the drift tools/check-chat-binding-coverage.py can only see at the text level.
#
# Model-gated cases self-skip without STELNETTTS_CHAT_TEST_MODEL, so this runs the
# symbol and pure-Dart layers and nothing that needs a download.
on:
  push:
    paths:
      - flutter/stelnettts/**
      - include/stelnettts_chat.h
      - include/stelnettts_session.h
      - src/chat.cpp
      - src/stelnettts_c_api.cpp
      - .github/workflows/bindings-dart.yml
  pull_request:
    paths:
      - flutter/stelnettts/**
      - include/stelnettts_chat.h
      - include/stelnettts_session.h
      - src/chat.cpp
      - src/stelnettts_c_api.cpp
      - .github/workflows/bindings-dart.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dart-lang/setup-dart@v1

      # stelnettts-lib, not stelnettts: the latter is the CLI's OUTPUT_NAME and is
      # only defined when the examples are built (the mistake that made the Rust
      # job red on its first run).
      - name: Build libstelnettts
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DSTELNETTTS_BUILD_TESTS=OFF \
            -DSTELNETTTS_BUILD_EXAMPLES=OFF \
            -DSTELNETTTS_BUILD_SERVER=OFF \
            -DGGML_CUDA=OFF \
            -DSTELNETTTS_OPUS_FETCH=ON
          cmake --build build -j"$(nproc)" --target stelnettts-lib

      - name: dart analyze + format
        working-directory: flutter/stelnettts
        run: |
          dart pub get
          dart format --output=none --set-exit-if-changed lib test

      - name: dart test (symbol resolution + pure-Dart; model cases self-skip)
        working-directory: flutter/stelnettts
        env:
          STELNETTTS_LIB: ${{ github.workspace }}/build/src/libstelnettts.so
        run: dart test
