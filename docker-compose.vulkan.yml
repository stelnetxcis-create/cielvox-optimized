services:
  stelnettts:
    image: ${STELNETTTS_IMAGE_VULKAN:-stelnettts-local:main-vulkan}
    build:
      context: .
      dockerfile: .devops/main-vulkan.Dockerfile
    ports:
      - "${STELNETTTS_HOST_PORT:-${STELNETTTS_PORT:-8080}}:${STELNETTTS_PORT:-8080}"
    user: "${STELNETTTS_UID:-1000}:${STELNETTTS_GID:-1000}"
    group_add:
      - video
      - render
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./models:/models
      - stelnettts-cache:/cache
    environment:
      STELNETTTS_MODEL: ${STELNETTTS_MODEL:-/models/model.gguf}
      STELNETTTS_BACKEND: ${STELNETTTS_BACKEND:-}
      STELNETTTS_LANGUAGE: ${STELNETTTS_LANGUAGE:-auto}
      STELNETTTS_PORT: ${STELNETTTS_PORT:-8080}
      STELNETTTS_AUTO_DOWNLOAD: ${STELNETTTS_AUTO_DOWNLOAD:-0}
      STELNETTTS_CACHE_DIR: ${STELNETTTS_CACHE_DIR:-/cache}
      STELNETTTS_API_KEYS: ${STELNETTTS_API_KEYS:-}
      STELNETTTS_EXTRA_ARGS: ${STELNETTTS_EXTRA_ARGS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${STELNETTTS_PORT:-8080}/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  stelnettts-cache:
